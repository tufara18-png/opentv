name: Build

on:
  push:
    branches: [main, feat/streaming-first-catalog, fusion/telly-front]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reject Compose and Telly
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'androidx\.compose|@Composable|org\.jetbrains\.kotlin\.plugin\.compose|compose[[:space:]]*=[[:space:]]*true|activity-compose|navigation-compose|coil-compose'             app/src app/build.gradle.kts build.gradle.kts gradle/libs.versions.toml 2>/dev/null; then
            echo "Compose reference found; native-TV build must stay Compose-free."
            exit 1
          fi
          test ! -e telly
          test ! -e tellyFrontend
          test ! -e .gitmodules

      - name: Verify release runtime is Compose-free
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew app:dependencies --configuration releaseRuntimeClasspath > release-runtime-deps.txt
          if grep -Ei 'androidx[.-]compose|activity-compose|navigation-compose|coil-compose|telly' release-runtime-deps.txt; then
            echo "Compose/Telly dependency found in release runtime."
            exit 1
          fi

      - name: Test release variant
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Assemble optimized R8 release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify optimized release output
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/mapping/release/mapping.txt
          if grep -R -n 'android:debuggable="true"' app/build/intermediates/merged_manifests/release 2>/dev/null; then
            echo "Release manifest is debuggable."
            exit 1
          fi
          echo "R8 mapping present and release APK is non-debuggable."

      - name: Upload R8 release APK
        uses: actions/upload-artifact@v4
        with:
          name: tufaratv-release-r8-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: tufaratv-release-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
