name: Build

on:
  push:
    branches: [main, feat/streaming-first-catalog, fusion/telly-front]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reject Compose and Telly
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'androidx\.compose|@Composable|org\.jetbrains\.kotlin\.plugin\.compose|compose[[:space:]]*=[[:space:]]*true|activity-compose|navigation-compose|coil-compose'             app/src app/build.gradle.kts build.gradle.kts gradle/libs.versions.toml 2>/dev/null; then
            echo "Compose reference found; native-TV build must stay Compose-free."
            exit 1
          fi
          test ! -e telly
          test ! -e tellyFrontend
          test ! -e .gitmodules

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release performance APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tufaratv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release performance APK
        uses: actions/upload-artifact@v4
        with:
          name: tufaratv-release-perf-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
