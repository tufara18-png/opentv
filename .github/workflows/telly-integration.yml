name: Telly integration

on:
  push:
    branches: [fusion/telly-front]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: telly-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Telly submodule
        id: submodule
        shell: bash
        run: |
          set +e
          git submodule sync --recursive > submodule.log 2>&1
          git submodule update --init --recursive >> submodule.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -n 120 submodule.log > submodule-tail.txt
          exit 0

      - name: Runner toolchain
        shell: bash
        run: |
          java -version
          ./gradlew --version

      - name: Compile integration
        id: compile
        if: steps.submodule.outputs.code == '0'
        shell: bash
        run: |
          set +e
          ./gradlew :tellyFrontend:compileDebugKotlin :app:compileDebugKotlin --stacktrace > compile.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -n 180 compile.log > compile-tail.txt
          exit 0

      - name: Unit tests
        id: tests
        if: steps.compile.outputs.code == '0'
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest --stacktrace > tests.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -n 120 tests.log > tests-tail.txt
          exit 0

      - name: Assemble debug APK
        id: assemble
        if: steps.compile.outputs.code == '0' && steps.tests.outputs.code == '0'
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > assemble.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -n 100 assemble.log > assemble-tail.txt
          exit 0

      - name: Publish verification result to PR
        if: always()
        uses: actions/github-script@v7
        env:
          SUBMODULE_CODE: ${{ steps.submodule.outputs.code }}
          COMPILE_CODE: ${{ steps.compile.outputs.code }}
          TEST_CODE: ${{ steps.tests.outputs.code }}
          ASSEMBLE_CODE: ${{ steps.assemble.outputs.code }}
        with:
          script: |
            const fs = require('fs');
            const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
            const submodule = process.env.SUBMODULE_CODE || 'skipped';
            const compile = process.env.COMPILE_CODE || 'skipped';
            const tests = process.env.TEST_CODE || 'skipped';
            const assemble = process.env.ASSEMBLE_CODE || 'skipped';
            const failingLog =
              submodule !== '0' ? read('submodule-tail.txt') :
              compile !== '0' ? read('compile-tail.txt') :
              tests !== '0' ? read('tests-tail.txt') :
              assemble !== '0' ? read('assemble-tail.txt') : '';
            const ok = submodule === '0' && compile === '0' && tests === '0' && assemble === '0';
            const body = [
              '<!-- telly-integration-ci -->',
              '### Telly integration CI',
              '',
              `Commit: \`${context.sha.slice(0, 8)}\``,
              `Submodule: **${submodule === '0' ? 'PASS' : submodule === 'skipped' ? 'SKIPPED' : 'FAIL'}**`,
              `Compile: **${compile === '0' ? 'PASS' : compile === 'skipped' ? 'SKIPPED' : 'FAIL'}**`,
              `Unit tests: **${tests === '0' ? 'PASS' : tests === 'skipped' ? 'SKIPPED' : 'FAIL'}**`,
              `APK: **${assemble === '0' ? 'PASS' : assemble === 'skipped' ? 'SKIPPED' : 'FAIL'}**`,
              failingLog ? '\n<details><summary>Failure log tail</summary>\n\n\`\`\`text\n' + failingLog.slice(-12000) + '\n\`\`\`\n</details>' : '',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 4,
            });
            const old = comments.find(c => c.user.type === 'Bot' && c.body?.includes('<!-- telly-integration-ci -->'));
            if (old) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: old.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: 4, body,
              });
            }
            if (!ok) core.setFailed('Telly integration verification failed');

      - name: Upload APK
        if: steps.assemble.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: telly-integration-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
