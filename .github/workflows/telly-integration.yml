name: Telly integration

on:
  push:
    branches: [fusion/telly-front]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telly-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Telly submodule
        id: submodule
        shell: bash
        run: |
          set +e
          git submodule sync --recursive > submodule.log 2>&1
          git submodule update --init --recursive >> submodule.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -n 120 submodule.log > submodule-tail.txt
          exit 0

      - name: Runner toolchain
        shell: bash
        run: |
          java -version
          ./gradlew --version

      - name: Compile integration
        id: compile
        if: steps.submodule.outputs.code == '0'
        shell: bash
        run: |
          set +e
          ./gradlew :tellyFrontend:compileDebugKotlin :app:compileDebugKotlin --stacktrace > compile.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -n 180 compile.log > compile-tail.txt
          exit 0

      - name: Unit tests
        id: tests
        if: steps.compile.outputs.code == '0'
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest --stacktrace > tests.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -n 120 tests.log > tests-tail.txt
          exit 0

      - name: Assemble debug APK
        id: assemble
        if: steps.compile.outputs.code == '0' && steps.tests.outputs.code == '0'
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > assemble.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          tail -n 100 assemble.log > assemble-tail.txt
          exit 0

      - name: Verify integration result
        if: always()
        shell: bash
        env:
          SUBMODULE_CODE: ${{ steps.submodule.outputs.code }}
          COMPILE_CODE: ${{ steps.compile.outputs.code }}
          TEST_CODE: ${{ steps.tests.outputs.code }}
          ASSEMBLE_CODE: ${{ steps.assemble.outputs.code }}
        run: |
          echo "Submodule: ${SUBMODULE_CODE:-skipped}"
          echo "Compile: ${COMPILE_CODE:-skipped}"
          echo "Tests: ${TEST_CODE:-skipped}"
          echo "APK: ${ASSEMBLE_CODE:-skipped}"
          test "${SUBMODULE_CODE:-1}" = "0"
          test "${COMPILE_CODE:-1}" = "0"
          test "${TEST_CODE:-1}" = "0"
          test "${ASSEMBLE_CODE:-1}" = "0"

      - name: Upload APK
        if: steps.assemble.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: telly-integration-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
